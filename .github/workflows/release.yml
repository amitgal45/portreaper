name: Release

# A `vX.Y.Z` tag builds the macOS app, signs the updater bundle with the minisign key in the
# repository's secrets, and publishes a GitHub Release carrying the .dmg, the .app.tar.gz with its
# .sig, and the latest.json the running app checks (`plugins.updater.endpoints` in
# src-tauri/tauri.conf.json). The recipe that gets here is in CLAUDE.md: a `## X.Y.Z` section at
# the top of CHANGELOG.md, the three version fields bumped in one commit, then the tag.
#
# Once the release is published, the `cask` job builds the Homebrew cask for it
# (packaging/homebrew/portreaper.rb with the version and the published DMG's SHA-256) and the
# `tap` job writes it to Casks/portreaper.rb in amitgal45/homebrew-tap, with the TAP_TOKEN secret.
# A manual run from main (Actions > Release > Run workflow) with `tag` set to an existing release
# builds and publishes nothing: it only rewrites the tap from that release, to backfill one or to
# retry after a failed `tap` job.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag (vX.Y.Z) whose DMG the tap should point at"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # The `tap` job below writes the cask with the TAP_TOKEN secret once the release is out. Check
  # the token before the build, not after: a release that cannot reach the tap would publish a DMG
  # the cask does not know, and `brew` would keep installing the previous one. This proves the
  # token can read the tap; a token without write access still fails in the `tap` job, which a
  # manual run with `tag` then retries.
  #
  # Its own job, with only `run:` steps and no GITHUB_TOKEN permissions, rather than a step of
  # `release`: there, the actions that run first (toolchains, caches) could put their own `gh` on
  # the PATH and be handed the token. No action ever runs next to TAP_TOKEN.
  tap-token:
    name: The tap token must reach amitgal45/homebrew-tap
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: The tap token must reach amitgal45/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the TAP_TOKEN secret is not set. Store a fine-grained token for amitgal45/homebrew-tap with Contents: Read and write as the TAP_TOKEN repository secret, then re-run this workflow; nothing was published." >&2
            exit 1
          fi
          if ! gh api repos/amitgal45/homebrew-tap --jq .full_name; then
            echo "::error::TAP_TOKEN cannot reach amitgal45/homebrew-tap. Store a fine-grained token for that repository with Contents: Read and write as the TAP_TOKEN repository secret, then re-run this workflow; nothing was published." >&2
            exit 1
          fi

  release:
    name: Build, sign and publish (macOS)
    # A tag push only, once the tap token is known to work; a manual run rewrites the tap and
    # builds nothing.
    needs: tap-token
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # One universal binary for Intel and Apple Silicon: the Tauri CLI builds both targets and
      # joins them with lipo (`--target universal-apple-darwin` below). The runner is arm64 and
      # has only its own target; the Intel one has to be added.
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The updater compares latest.json's version with the running app's (tauri.conf.json), and
      # tauri-action names the release from the app version too: a tag that says otherwise would
      # publish under the wrong name. Stop here instead.
      - name: The tag must match the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$tag" != "$app" ]; then
            echo "::error::tag v$tag but src-tauri/tauri.conf.json says $app; bump the three version fields, then tag" >&2
            exit 1
          fi

      # The release body: CHANGELOG.md's section for this version, which the app shows in its
      # update dialog too.
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          body="$(awk -v v="$version" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## $version' section with content" >&2
            exit 1
          fi
          delimiter="notes-$RANDOM-$RANDOM"
          {
            echo "body<<$delimiter"
            printf '%s\n' "$body"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # Runs `pnpm tauri build` (app + dmg, and the .app.tar.gz the private key signs), creates
      # the release for the tag and uploads the artifacts plus latest.json. The updater artifact
      # is switched on here only (src-tauri/tauri.release.conf.json merged over tauri.conf.json):
      # with it on, the Tauri CLI refuses to build without the private key, and CI's unsigned
      # build has none. The private key never leaves the secrets; its public half is in the repo.
      #
      # The universal target names the artifacts `PortReaper_X.Y.Z_universal.dmg` and
      # `PortReaper_universal.app.tar.gz`, and tauri-action (v0 = 0.6.2) writes the one bundle
      # under both `darwin-aarch64` and `darwin-x86_64` (plus the `-app` variants) in
      # latest.json, which is what an installed native build looks up; `darwin-universal` is only
      # written with `updaterJsonKeepUniversal`, and nothing looks it up.
      # Developer ID signing and notarization, done by the Tauri bundler from six secrets: it
      # imports the certificate (a base64 .p12) into a throwaway keychain, signs every binary
      # with the hardened runtime, submits the bundle to Apple's notary service with the Apple
      # ID + app-specific password + team id, and staples the ticket. A missing secret has to
      # stop the run here: with no identity the CLI signs nothing, and Apple Silicon Gatekeeper
      # reports the downloaded copy as "damaged" with no way to open it. Setting the six:
      # CLAUDE.md, "Signing". CI's PR build stays ad-hoc ("-"); fork PRs get no secrets.
      - name: The six Apple secrets must be set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::repository secrets missing:$missing. Set them (CLAUDE.md, Signing) before tagging; an unsigned release opens as damaged." >&2
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "PortReaper v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --target universal-apple-darwin

  # Builds the cask for the release: the template with the version and the SHA-256 of the DMG the
  # release published (scripts/bump-cask.mjs). The `tap` job writes it; this one never sees
  # TAP_TOKEN, so the actions it runs (checkout, setup-node) never run next to it. After a tag
  # push it runs once `release` has published. On a manual run `release` is skipped, and `needs`
  # alone would skip this job too; hence the explicit condition.
  cask:
    name: Build the Homebrew cask
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      cask: ${{ steps.cask.outputs.cask }}
    # `bash -eo pipefail`: a failing command on the left of a pipe fails the step.
    defaults:
      run:
        shell: bash
    steps:
      # The tag pushed, or the `tag` input of a manual run. Both reach the script through env
      # only, and nothing else is accepted, since the tag goes into a download pattern, a commit
      # message and the cask. A manual run must start from main: it uses that run's template,
      # script and workflow, and only main's are reviewed.
      - name: Resolve the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::run this workflow by hand from main, not $(printf '%q' "$REF"): the cask is written from that run's template and script" >&2
              exit 1
            fi
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$tag" =~ $re ]]; then
            echo "::error::the tag must be vX.Y.Z, got $(printf '%q' "$tag")" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      # The template and the script from the commit this run is for: the tag's on a tag push, the
      # chosen branch's (main) on a manual run. Not the tag's on a manual run: tags before the
      # first one with this job (v0.4.0) have neither scripts/bump-cask.mjs nor a template the
      # script accepts, and a backfill of them must still work. No credentials are kept on disk.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No pnpm: scripts/bump-cask.mjs has no dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The cask's sha256 is the hash of what users download: the DMG asset the release
      # published, not a rebuild. GitHub records its own SHA-256 of every uploaded asset
      # (`digest`); when it has one, the two must agree, which catches a download corrupted on the
      # way (an asset replaced on GitHub gets a new digest, so this does not catch that). Older
      # assets may carry none; then the downloaded file's hash is used as is.
      - name: Hash the published DMG
        id: dmg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          name="PortReaper_${VERSION}_universal.dmg"
          mkdir -p "$RUNNER_TEMP/dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/dmg"
          sha="$(sha256sum "$RUNNER_TEMP/dmg/$name" | cut -d' ' -f1)"
          # Two steps, not one pipeline: without pipefail a failed API call would read as "no digest".
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | [.name, (.digest // "")] | @tsv')"
          digest="$(printf '%s\n' "$assets" | awk -F'\t' -v n="$name" '$1 == n { print $2 }')"
          case "$digest" in
            "" | null)
              echo "::notice::GitHub has no digest for $name; using the downloaded file's SHA-256 $sha unchecked"
              ;;
            "sha256:$sha")
              echo "$name: SHA-256 $sha, the same as GitHub's digest"
              ;;
            *)
              echo "::error::$name: the downloaded file's SHA-256 is $sha, but GitHub's digest is $digest" >&2
              exit 1
              ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The cask goes to the `tap` job as a job output, base64 so that it is one line.
      - name: Build the cask
        id: cask
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          SHA: ${{ steps.dmg.outputs.sha }}
        run: |
          node scripts/bump-cask.mjs packaging/homebrew/portreaper.rb "$VERSION" "$SHA" > "$RUNNER_TEMP/portreaper.rb"
          # Never write a cask that is empty or lacks this release's pair, whatever the script did.
          if ! grep -qxF "  version \"$VERSION\"" "$RUNNER_TEMP/portreaper.rb" || ! grep -qxF "  sha256 \"$SHA\"" "$RUNNER_TEMP/portreaper.rb"; then
            echo "::error::scripts/bump-cask.mjs did not produce a cask with version $VERSION and sha256 $SHA" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/portreaper.rb"
          echo "cask=$(base64 -w0 < "$RUNNER_TEMP/portreaper.rb")" >> "$GITHUB_OUTPUT"

  # Writes Casks/portreaper.rb in amitgal45/homebrew-tap: the only job that sees TAP_TOKEN, and
  # it runs no action at all, only the `run:` step below with the runner's own `gh`. Through the
  # Contents API rather than git: no clone, no credentials on disk, and one commit per release.
  tap:
    name: Update the Homebrew tap
    needs: cask
    if: ${{ !cancelled() && needs.cask.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    # One write to the tap at a time, in the order the runs started: two releases finishing close
    # together never interleave their reads and writes of the cask.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Write Casks/portreaper.rb to amitgal45/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.cask.outputs.version }}
          CASK: ${{ needs.cask.outputs.cask }}
        run: |
          printf '%s' "$CASK" | base64 -d > "$RUNNER_TEMP/portreaper.rb"
          if ! [ -s "$RUNNER_TEMP/portreaper.rb" ]; then
            echo "::error::the cask job handed over no cask" >&2
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the TAP_TOKEN secret is not set. Store a fine-grained token for amitgal45/homebrew-tap with Contents: Read and write as the TAP_TOKEN repository secret, then run Release by hand with this tag." >&2
            exit 1
          fi
          api=repos/amitgal45/homebrew-tap/contents/Casks/portreaper.rb
          # The current file's blob sha, which the API needs to replace it; none on the first write,
          # which creates the file.
          current=""
          blob='^[0-9a-f]{40}$'
          if found="$(gh api "$api" --jq .sha)" && [[ "$found" =~ $blob ]]; then
            current="$found"
          else
            echo "No readable Casks/portreaper.rb in the tap; writing it as a new file."
          fi
          # The same cask already there (a re-run): stop rather than make an empty commit.
          if [ -n "$current" ]; then
            gh api "$api" --jq .content | base64 -d > "$RUNNER_TEMP/tap-current.rb"
            if cmp -s "$RUNNER_TEMP/tap-current.rb" "$RUNNER_TEMP/portreaper.rb"; then
              echo "::notice::Casks/portreaper.rb in amitgal45/homebrew-tap is already the cask for $VERSION; nothing to write"
              exit 0
            fi
          fi
          args=(-X PUT "$api" -f message="portreaper $VERSION" -f content="$(base64 -w0 < "$RUNNER_TEMP/portreaper.rb")")
          if [ -n "$current" ]; then
            args+=(-f sha="$current")
          fi
          gh api "${args[@]}" --jq .commit.html_url
