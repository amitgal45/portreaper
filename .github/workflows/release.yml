name: Release

# A `vX.Y.Z` tag builds the macOS app, signs the updater bundle with the minisign key in the
# repository's secrets, and publishes a GitHub Release carrying the .dmg, the .app.tar.gz with its
# .sig, and the latest.json the running app checks (`plugins.updater.endpoints` in
# src-tauri/tauri.conf.json). The recipe that gets here is in CLAUDE.md: a `## X.Y.Z` section at
# the top of CHANGELOG.md, the three version fields bumped in one commit, then the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # One universal binary for Intel and Apple Silicon: the Tauri CLI builds both targets and
      # joins them with lipo (`--target universal-apple-darwin` below). The runner is arm64 and
      # has only its own target; the Intel one has to be added.
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The updater compares latest.json's version with the running app's (tauri.conf.json), and
      # tauri-action names the release from the app version too: a tag that says otherwise would
      # publish under the wrong name. Stop here instead.
      - name: The tag must match the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$tag" != "$app" ]; then
            echo "::error::tag v$tag but src-tauri/tauri.conf.json says $app; bump the three version fields, then tag" >&2
            exit 1
          fi

      # The release body: CHANGELOG.md's section for this version, which the app shows in its
      # update dialog too.
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          body="$(awk -v v="$version" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## $version' section with content" >&2
            exit 1
          fi
          delimiter="notes-$RANDOM-$RANDOM"
          {
            echo "body<<$delimiter"
            printf '%s\n' "$body"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # Runs `pnpm tauri build` (app + dmg, and the .app.tar.gz the private key signs), creates
      # the release for the tag and uploads the artifacts plus latest.json. The updater artifact
      # is switched on here only (src-tauri/tauri.release.conf.json merged over tauri.conf.json):
      # with it on, the Tauri CLI refuses to build without the private key, and CI's unsigned
      # build has none. The private key never leaves the secrets; its public half is in the repo.
      #
      # The universal target names the artifacts `PortReaper_X.Y.Z_universal.dmg` and
      # `PortReaper_universal.app.tar.gz`, and tauri-action (v0 = 0.6.2) writes the one bundle
      # under both `darwin-aarch64` and `darwin-x86_64` (plus the `-app` variants) in
      # latest.json, which is what an installed native build looks up; `darwin-universal` is only
      # written with `updaterJsonKeepUniversal`, and nothing looks it up.
      # Developer ID signing and notarization, done by the Tauri bundler from six secrets: it
      # imports the certificate (a base64 .p12) into a throwaway keychain, signs every binary
      # with the hardened runtime, submits the bundle to Apple's notary service with the Apple
      # ID + app-specific password + team id, and staples the ticket. A missing secret has to
      # stop the run here: with no identity the CLI signs nothing, and Apple Silicon Gatekeeper
      # reports the downloaded copy as "damaged" with no way to open it. Setting the six:
      # CLAUDE.md, "Signing". CI's PR build stays ad-hoc ("-"); fork PRs get no secrets.
      - name: The six Apple secrets must be set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::repository secrets missing:$missing. Set them (CLAUDE.md, Signing) before tagging; an unsigned release opens as damaged." >&2
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "PortReaper v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --target universal-apple-darwin
