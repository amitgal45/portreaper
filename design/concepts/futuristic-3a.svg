<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    
  <defs>
    <clipPath id="squircle-f3a">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>

    <!-- Anodized Obsidian-to-Void base gradient -->
    <linearGradient id="bg-grad-f3a" x1="15%" y1="8%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#1E222D"/>
      <stop offset="45%" stop-color="#111319"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>

    <!-- Top-left studio light sheen on squircle -->
    <radialGradient id="top-sheen-f3a" cx="28%" cy="14%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Subsurface neon aura -->
    <radialGradient id="aura-1-f3a" cx="512" cy="512" r="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4528" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#FF9A3C" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0A0B0E" stop-opacity="0"/>
    </radialGradient>

    <!-- Specular glass rim gradient -->
    <linearGradient id="rim-grad-f3a" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="30%" stop-color="#FF4528" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#FF9A3C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Soft volumetric drop shadow + neon bloom -->
    <filter id="drop-glow-f3a" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#FF4528" flood-opacity="0.28"/>
    </filter>

    <filter id="neon-bloom-f3a" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer squircle shadow on canvas -->
  <rect x="100" y="114" width="824" height="824" rx="185" fill="#000000" fill-opacity="0.28"/>

  <!-- Main squircle plate -->
  <g clip-path="url(#squircle-f3a)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg-grad-f3a)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#aura-1-f3a)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#top-sheen-f3a)"/>

    <!-- Subtle cmux/Antigravity precision radar & cartesian micro-grid -->
    <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1.5" fill="none">
      <circle cx="512" cy="512" r="180"/>
      <circle cx="512" cy="512" r="290"/>
      <circle cx="512" cy="512" r="400"/>
      <line x1="100" y1="330" x2="924" y2="330"/>
      <line x1="100" y1="512" x2="924" y2="512"/>
      <line x1="100" y1="694" x2="924" y2="694"/>
      <line x1="330" y1="100" x2="330" y2="924"/>
      <line x1="512" y1="100" x2="512" y2="924"/>
      <line x1="694" y1="100" x2="694" y2="924"/>
    </g>
  </g>

  <!-- Apple macOS 26 specular inner rim highlight -->
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#rim-grad-f3a)" stroke-width="6"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#050608" stroke-width="2" stroke-opacity="0.6"/>
  
    <defs>
      <linearGradient id="left-glass-f3a" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF7E54"/>
        <stop offset="50%" stop-color="#FF4528"/>
        <stop offset="100%" stop-color="#B91C3C"/>
      </linearGradient>
      <linearGradient id="right-glass-f3a" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF5E3A"/>
        <stop offset="55%" stop-color="#E11D48"/>
        <stop offset="100%" stop-color="#7E22CE"/>
      </linearGradient>
      <linearGradient id="laser-beam-f3a" x1="35%" y1="90%" x2="65%" y2="10%">
        <stop offset="0%" stop-color="#FF4528" stop-opacity="0"/>
        <stop offset="20%" stop-color="#FF9A3C" stop-opacity="0.95"/>
        <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
        <stop offset="80%" stop-color="#FF4528" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- Recessed Dark Port Core Glow -->
    <rect x="276" y="326" width="472" height="240" rx="20" fill="#07080C" fill-opacity="0.65"/>

    <!-- Left & Right 3D Severed Socket Brackets -->
    <g filter="url(#drop-glow-f3a)">
      <path d="M174 248 A24 24 0 0 1 198 224 H517.8 Q490.2 277.3 465.9 330 H280 V560 H381.9 Q367.3 676.9 361.9 796 H296 A24 24 0 0 1 272 772 V666 H198 A24 24 0 0 1 174 642 Z" fill="url(#left-glass-f3a)" stroke="#FFD7C9" stroke-opacity="0.6" stroke-width="4.5"/>
      <path d="M649.8 224 H826 A24 24 0 0 1 850 248 V642 A24 24 0 0 1 826 666 H752 V772 A24 24 0 0 1 728 796 H493.9 Q496.5 743 503.1 690 H646 V560 H744 V330 H597.9 Q622.2 277.3 649.8 224 Z" fill="url(#right-glass-f3a)" stroke="#FFD7C9" stroke-opacity="0.55" stroke-width="4.5"/>
    </g>

    <!-- Molten Heated Cut-Face Highlights on both sides of the cut -->
    <g filter="url(#neon-bloom-f3a)" fill="none" stroke="#FFB74D" stroke-width="7" stroke-linecap="round">
      <path d="M517.8 224 Q490.2 277.3 465.9 330"/>
      <path d="M381.9 560 Q367.3 676.9 361.9 796"/>
      <path d="M649.8 224 Q622.2 277.3 597.9 330"/>
      <path d="M503.1 690 Q496.5 743 493.9 796"/>
    </g>

    <!-- Razor-Sharp Anti-Gravity Plasma Scythe Arc Slicing Through the Gap -->
    <g filter="url(#neon-bloom-f3a)">
      <path d="M412 856 Q434 480 618 164" fill="none" stroke="#FF4528" stroke-width="18" stroke-linecap="round" stroke-opacity="0.45"/>
      <path d="M412 856 Q434 480 618 164" fill="none" stroke="url(#laser-beam-f3a)" stroke-width="7" stroke-linecap="round"/>
    </g>
  </svg>
