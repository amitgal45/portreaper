<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    PortReaper app icon, "Prismatic Cut Socket" (3B), tinted / clear appearance (macOS 26): how the
    icon looks once macOS takes it to one colour. The glyph of glyph.svg in white on a slate plate,
    the glass panel kept, no gradients and no bloom (macOS draws its own). A preview, and the
    reference for an Icon Composer `.icon` file, which uses glyph.svg as its layer. Not rendered
    by `pnpm icons` (design/README.md, "Appearances").
  -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M388 892 Q398 475 636 132" fill="none" stroke="#000" stroke-width="88"/>
    </mask>
    <linearGradient id="plate-fill" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
      <stop offset="0" stop-color="#3A4250"/>
      <stop offset="1" stop-color="#232933"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate-fill)"/>
  <path d="M280 330 V574 H390 V694 H634 V574 H744 V330 Z"
        fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M184 258 A24 24 0 0 1 208 234 H816 A24 24 0 0 1 840 258 V646 A24 24 0 0 1 816 670 H730 V766 A24 24 0 0 1 706 790 H318 A24 24 0 0 1 294 766 V670 H208 A24 24 0 0 1 184 646 Z M280 330 V574 H390 V694 H634 V574 H744 V330 Z"
        fill="#F2F3F5" fill-rule="evenodd" mask="url(#cut)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
</svg>
