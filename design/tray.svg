<svg xmlns="http://www.w3.org/2000/svg" viewBox="112 112 800 800" width="800" height="800">
  <!--
    PortReaper menu-bar icon: the glyph from icon.svg, black on transparent, no plate.
    macOS treats it as a template image (`icon_as_template(true)`) and tints it itself, so only
    the alpha channel matters. Same geometry and the same scythe cut as the app icon; the wall
    and the cut are a touch lighter (84 instead of 96 and 88, corner radius 21 instead of 24)
    because menu-bar glyphs sit lighter than Dock icons, and the view box is tightened so the
    glyph fills a 22 pt slot the way system icons do (about 18 x 15 pt).
    Rendered by `pnpm icons` to tray-22.png / tray-44.png.
  -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M388 892 Q398 475 636 132" fill="none" stroke="#000" stroke-width="84"/>
    </mask>
  </defs>

  <path d="M190 261 A21 21 0 0 1 211 240 H813 A21 21 0 0 1 834 261 V643 A21 21 0 0 1 813 664 H724 V763 A21 21 0 0 1 703 784 H321 A21 21 0 0 1 300 763 V664 H211 A21 21 0 0 1 190 643 Z M274 324 V580 H384 V700 H640 V580 H750 V324 Z"
        fill="#000" fill-rule="evenodd" mask="url(#cut)"/>
</svg>
