<svg xmlns="http://www.w3.org/2000/svg" viewBox="112 112 800 800" width="800" height="800">
  <!--
    PortReaper menu-bar icon: the sheared, tapered Cut Socket glyph from icon.svg,
    black on transparent, no plate. macOS treats it as a template image
    (`icon_as_template(true)`) and tints it itself, so only the alpha channel matters.
    Uses a pure compound <path> (no <mask>) with a 98 px wall, 22 px outer corners, a
    tapered 128–164 px scythe gap, and an 18 px diagonal shear so the cut and both
    socket brackets read crisply at 22 px / 44 px (`pnpm icons` -> tray-22.png, tray-44.png).
  -->
