  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#rim-dark)" stroke-width="6"/>
  <rect x="252" y="298" width="520" height="296" rx="44" fill="url(#echo-dark)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="3"/>
  <g filter="url(#glow-dark)">
    <path d="M166 264 A26 26 0 0 1 192 238 H492.4 Q465.6 291.7 442.2 346 H278 V566 H368.1 Q353.3 683 347.9 802 H294 A26 26 0 0 1 268 776 V674 H192 A26 26 0 0 1 166 648 Z" fill="url(#prism-left-dark)" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="5"/>
    <path d="M669.8 218 H830 A26 26 0 0 1 856 244 V630 A26 26 0 0 1 830 656 H756 V756 A26 26 0 0 1 730 782 H499.1 Q503.8 728 512.7 674 H648 V546 H746 V326 H613.2 Q639.7 271.7 669.8 218 Z" fill="url(#prism-right-dark)" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="5"/>
  </g>
  <path d="M198 242 H478" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M680 222 H824" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.75"/>
