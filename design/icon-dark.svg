<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- PortReaper app icon — Dark appearance (Void Black #0A0B0E plate, Prismatic Cut Socket 3B). -->
  <defs>
    <clipPath id="squircle-dark">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <linearGradient id="bg-dark" x1="15%" y1="8%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="50%" stop-color="#0A0B0E"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>
    <radialGradient id="aura-dark" cx="512" cy="512" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4528" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#A78BFA" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0A0B0E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim-dark" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#FF4528" stop-opacity="0.34"/>
      <stop offset="80%" stop-color="#4EA1FF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#26292F" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow-dark" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#FF4528" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="prism-left-dark" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="45%" stop-color="#FF4528"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="prism-right-dark" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#4EA1FF"/>
      <stop offset="45%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#FF4528"/>
    </linearGradient>
    <linearGradient id="echo-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#squircle-dark)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg-dark)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#aura-dark)"/>
    <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1.5" fill="none">
