<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    PortReaper app icon. Source of truth: `pnpm icons` renders this to src-tauri/icons/.

    Two colours. A charcoal plate on Apple's icon grid (824 px square, 100 px margin, 185 px
    corner radius) and one glyph: the face of an Ethernet socket, drawn as a bold outline, cut
    in two by a clean diagonal. The cut is the whole story: a port, and the act of freeing it.
    No skull, no scythe, no gradient, no text.

    The mask removes a diagonal band from the glyph. Its region is set in user space on purpose:
    the default (-10 %..120 % of the glyph's box) would clip the outer half of the stroke.
  -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <line x1="388" y1="892" x2="636" y2="132" stroke="#000" stroke-width="88"/>
    </mask>
  </defs>

  <!-- the plate -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#14161C"/>

  <!-- the socket: a wide body with the narrower latch tab below, 96 px stroke, rounded joins -->
  <path d="M232 282 H792 V622 H682 V742 H342 V622 H232 Z"
        fill="none" stroke="#FF5E3A" stroke-width="96" stroke-linejoin="round"
        mask="url(#cut)"/>
</svg>
