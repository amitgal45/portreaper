[package]
name = "portreaper"
version = "0.1.0"
description = "See every listening port on your Mac, which project it belongs to, and kill it in one click."
authors = ["Amit Gal"]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows linker issue,
# see https://github.com/rust-lang/cargo/issues/8519). Kept so a Windows build stays possible.
name = "portreaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Which process listens on which port, without shelling out to lsof. macOS, Linux, Windows.
listeners = "0.6"
# Process details (command line, cwd, memory, parent, start time) and signals.
sysinfo = "0.39"
libc = "0.2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
